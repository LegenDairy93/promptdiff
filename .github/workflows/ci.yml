name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-test-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Smoke test support-bot example
        run: |
          node dist/cli.js run --config examples/support-bot/promptdiff.config.yml --prompt baseline
          node dist/cli.js run --config examples/support-bot/promptdiff.config.yml --prompt candidate
          node dist/cli.js diff baseline latest

      - name: Smoke test prompt-to-agent diff
        run: |
          node dist/cli.js run --config examples/prompt-to-agent/promptdiff.config.yml --target prompt-baseline
          node dist/cli.js run --config examples/prompt-to-agent/promptdiff.config.yml --target agent-candidate
          node dist/cli.js diff prompt-baseline agent-candidate
          mkdir -p site
          node dist/cli.js report prompt-baseline agent-candidate --output site/index.html --projected-calls 100000

      - name: Smoke test json-classifier example
        run: |
          node dist/cli.js run --config examples/json-classifier/promptdiff.config.yml --prompt baseline
          node dist/cli.js run --config examples/json-classifier/promptdiff.config.yml --prompt candidate
          node dist/cli.js diff baseline latest
      - name: Upload live report
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy-report:
    if: github.event_name == 'push'
    needs: build-test-smoke
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy live report
        id: deployment
        uses: actions/deploy-pages@v4