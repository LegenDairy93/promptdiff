name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-test-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Verify packed clean install
        run: npm run test:package

      - name: Smoke test support-bot example
        run: |
          node dist/cli.js run --config examples/support-bot/promptdiff.config.yml --prompt baseline
          node dist/cli.js run --config examples/support-bot/promptdiff.config.yml --prompt candidate
          node dist/cli.js diff baseline latest

      - name: Review candidate against approved baseline
        run: |
          node dist/cli.js run --config examples/prompt-to-agent/promptdiff.config.yml --target prompt-baseline
          node dist/cli.js promote latest --baseline production --actor github-actions --reason "Repository baseline target"
          mkdir -p site
          set +e
          node dist/cli.js check --config examples/prompt-to-agent/promptdiff.config.yml --target agent-candidate --baseline production --output site/index.html --projected-calls 100000 | tee promptdiff-check.txt
          status=${PIPESTATUS[0]}
          set -e
          {
            echo "## PromptDiff behavioral review"
            echo '```text'
            cat promptdiff-check.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Smoke test json-classifier example
        run: |
          node dist/cli.js run --config examples/json-classifier/promptdiff.config.yml --prompt baseline
          node dist/cli.js run --config examples/json-classifier/promptdiff.config.yml --prompt candidate
          node dist/cli.js diff baseline latest
      - name: Upload behavioral review artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: promptdiff-behavioral-review
          path: site/index.html
          if-no-files-found: warn

      - name: Upload deterministic example report to Pages
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy-report:
    if: github.event_name == 'push'
    needs: build-test-smoke
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy live report
        id: deployment
        uses: actions/deploy-pages@v4