<title id="title">Prompt output versus agent trace</title><desc id="desc">A one-shot prompt response and a four-step agent trace with a tool call.</desc><rect width="1100" height="430" rx="22" fill="#0d1117"/><text x="50" y="54" fill="#f0f6fc" font-family="ui-monospace,monospace" font-size="22" font-weight="700">promptdiff</text><text x="940" y="54" fill="#8b949e" font-family="system-ui" font-size="14">BEHAVIOR REVIEW</text>
<rect x="50" y="86" width="445" height="286" rx="14" fill="#161b22" stroke="#30363d"/><text x="76" y="122" fill="#79c0ff" font-family="system-ui" font-size="13" font-weight="700">PROMPT · BASELINE</text><text x="76" y="158" fill="#8b949e" font-family="system-ui" font-size="14">one model call</text><rect x="76" y="184" width="393" height="116" rx="9" fill="#21262d"/><text x="96" y="220" fill="#f0f6fc" font-family="ui-monospace,monospace" font-size="15">“You are guaranteed a refund.</text><text x="96" y="246" fill="#f0f6fc" font-family="ui-monospace,monospace" font-size="15">We will process it now.”</text><rect x="76" y="322" width="84" height="27" rx="13" fill="#3d1f28"/><text x="96" y="341" fill="#ff7b72" font-family="system-ui" font-size="12" font-weight="700">FAIL</text>
<path d="M520 229h45m-12-12 12 12-12 12" stroke="#8b949e" stroke-width="2" fill="none"/><rect x="590" y="86" width="460" height="286" rx="14" fill="#161b22" stroke="#30363d"/><text x="616" y="122" fill="#56d364" font-family="system-ui" font-size="13" font-weight="700">AGENT · CANDIDATE</text><text x="616" y="158" fill="#8b949e" font-family="system-ui" font-size="14">tools + ordered trace + final outcome</text>
